<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Watching Scene</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="scene-container">
        <div class="living-room">
            <div class="tv-stand">
                <div class="tv" id="tv">
                    <div class="tv-screen">
                        <div class="white-screen"></div>
                    </div>
                </div>
            </div>
            
            <div class="seating-area">
                <div class="person person-1">
                    <img src="person1.png" alt="Person 1 sitting in chair">
                </div>
                <div class="person person-2">
                    <img src="person2.png" alt="Person 2 sitting in chair">
                </div>
                <div class="person person-3">
                    <img src="person3.png" alt="Person 3 sitting in chair">
                </div>
                <div class="person person-4">
                    <img src="person4.png" alt="Person 4 sitting in chair">
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button id="regenerate-tv">Generate New TV</button>
            <button id="regenerate-people">Generate New People</button>
            <button id="regenerate-custom-people">Custom People</button>
        </div>
    </div>
    
    <!-- Custom People Modal -->
    <div id="custom-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Customize People</h2>
            <div class="input-section">
                <h3>Select Position</h3>
                <select id="slot-selector">
                    <option value="all">All positions</option>
                    <option value="1">Position 1 (left)</option>
                    <option value="2">Position 2</option>
                    <option value="3">Position 3</option>
                    <option value="4">Position 4 (right)</option>
                </select>
            </div>
            <div class="input-section">
                <h3>Option 1: Upload Image</h3>
                <input type="file" id="image-upload" accept="image/*">
                <div id="image-preview"></div>
            </div>
            <div class="input-section">
                <h3>Option 2: Text Description</h3>
                <textarea id="text-description" placeholder="Describe the person you want (e.g., 'elderly man with gray hair wearing a red sweater')"></textarea>
            </div>
            <button id="generate-custom">Generate</button>
        </div>
    </div>
    
    <script src="script.js"></script>

</body>
</html>
