<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Watching Scene</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="scene-container">
        <div class="living-room">
            <div class="tv-stand">
                <div class="tv" id="tv">
                    <img src="" alt="TV" id="tv-image" style="width: 100%; height: 100%; object-fit: contain;">
                </div>
            </div>
            
            <div class="seating-area">
                <div class="person person-1">
                    <img src="person1.png" alt="Person 1 sitting in chair">
                </div>
                <div class="person person-2">
                    <img src="person2.png" alt="Person 2 sitting in chair">
                </div>
                <div class="person person-3">
                    <img src="person3.png" alt="Person 3 sitting in chair">
                </div>
                <div class="person person-4">
                    <img src="person4.png" alt="Person 4 sitting in chair">
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button id="regenerate-tv">Generate New TV</button>
            <div class="character-controls">
                <h3>Generate Character for Chair Position:</h3>
                <div class="position-selector">
                    <label>Select Position:</label>
                    <select id="position-select">
                        <option value="0">Chair 1</option>
                        <option value="1">Chair 2</option>
                        <option value="2">Chair 3</option>
                        <option value="3">Chair 4</option>
                    </select>
                </div>
                <div class="input-options">
                    <div class="text-input-section">
                        <label for="character-prompt">Describe what should be sitting in the chair:</label>
                        <textarea id="character-prompt" placeholder="e.g., a cat, a robot, a person in business attire, etc."></textarea>
                    </div>
                    <div class="image-input-section">
                        <label for="reference-image">Or upload a reference image:</label>
                        <input type="file" id="reference-image" accept="image/*">
                        <canvas id="image-preview" style="display: none;"></canvas>
                    </div>
                </div>
                <button id="generate-character">Generate Character</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>

</body>
</html>
